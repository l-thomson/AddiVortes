[package]
name = "thiessen-r"
version = "0.0.0"
edition = "2021"
rust-version = "1.74"
publish = false

[features]
# Off in every build the package ships; `core_experimental()` reports the
# build's setting and the policy is docs/experimental.md in the repository.
experimental = ["thiessen/experimental"]

[lib]
name = "thiessen"
crate-type = ["staticlib"]

[dependencies]
extendr-api = "0.9"
# The fitted state persists as MessagePack with field names, so a double
# survives bit for bit and the serde field names still guard evolution.
rmp-serde = "1.3"
serde = { version = "1.0.166", features = ["derive"] }
# `float_roundtrip` so a configuration value parses to the nearest double;
# the default parser is accurate to within one ULP, which moves the draws.
serde_json = { version = "1.0.100", features = ["float_roundtrip"] }
thiessen = { path = "core" }

# Detached from the repository workspace: the tarball carries no root.
[workspace]

# The workspace root's release profile, which a detached manifest does not
# inherit.
[profile.release]
codegen-units = 1
lto = "fat"
