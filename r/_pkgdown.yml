url: https://l-thomson.github.io/thiessen/r
template:
  bootstrap: 5
  includes:
    # The package name is provisional, so the site is served but not
    # offered for indexing. Remove once the name is settled.
    in_header: '<meta name="robots" content="noindex, nofollow">'

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]

articles:
- title: Vignettes
  navbar: ~
  contents:
  - thiessen
  - h-addivortes
  - binary-addivortes
  - posterior
  - control-surface
  - sampler-api

reference:
- title: Fitting
  contents:
  - thiessen
  - thiessen_control
- title: Outcome families
  contents:
  - gaussian_outcome
  - probit_outcome
  - print.thiessen_outcome
- title: Experimental outcome families
  desc: >
    Compiled only into a core built with its `experimental` feature; see
    `experimental_outcomes`.
  contents:
  - tobit_outcome
  - aft_outcome
  - interval_censored_outcome
  - ordinal_outcome
  - student_t_outcome
  - laplace_outcome
  - experimental_outcomes
- title: Parameter groups
  contents:
  - term_params
  - geometry_params
  - structure_params
  - general_params
  - print.params
  - print.thiessen_control
- title: Fitted-model methods
  contents:
  - predict.thiessen
  - fitted.thiessen
  - sigma.thiessen
  - summary.thiessen
  - print.thiessen
  - plot.thiessen
- title: Posterior and rstantools generics
  contents:
  - as_draws_df.thiessen
  - ndraws.thiessen
  - posterior_predict.thiessen
  - posterior_epred.thiessen
  - log_lik.thiessen
