[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    # target-lexicon, a build dependency of pyo3.
    "Apache-2.0 WITH LLVM-exception",
    # rust-numpy.
    "BSD-2-Clause",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
