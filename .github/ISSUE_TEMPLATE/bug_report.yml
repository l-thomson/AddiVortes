name: Bug report
description: A reproducible problem in the core crate or a binding.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Crate or package version, or the dev commit.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Target triple or operating system and architecture.
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: Seed
      description: The seed passed to fit, if the report involves sampled values.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal configuration
      description: The smallest configuration and data shape that shows the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: What happened, and what was expected
    validations:
      required: true
