name: articles

# Knits the precomputed experimental articles of the R site from a fresh
# opt-in build, monthly and on demand, and opens a pull request when the
# output changed. A pull request opened with the workflow token does not
# start the CI workflow; push to its branch, or close and reopen it, to
# run the checks.

on:
  schedule:
    - cron: "27 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  knit:
    name: knit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          working-directory: r
      - run: tools/articles.sh all
      - name: Open a pull request when the articles changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- r/vignettes/articles && \
             [ -z "$(git ls-files --others --exclude-standard r/vignettes/articles)" ]; then
            echo "articles unchanged"
            exit 0
          fi
          branch="docs/articles-$(date -u +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add r/vignettes/articles
          git commit -m "docs(r): knit the experimental articles"
          git push --force origin "$branch"
          gh pr create --base dev --head "$branch" \
            --title "docs(r): knit the experimental articles" \
            --body "Monthly knit of the precomputed experimental articles from an opt-in build. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "pull request already open"
