[package]
name = "thiessen"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "Bayesian additive Voronoi tessellations (AddiVortes): Gibbs sampler, fit and predict"
repository = "https://github.com/l-thomson/thiessen"
documentation = "https://docs.rs/thiessen"
readme = "README.md"
keywords = ["bayesian", "mcmc", "regression", "voronoi", "nonparametric"]
categories = ["science", "mathematics", "algorithms"]
include = [
    "src/**",
    "Cargo.toml",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "NOTICE",
    "README.md",
    "examples/**",
]

[dependencies]
libm = "0.2"
rand = { version = "0.9", default-features = false }
rand_chacha = "0.9"
rand_core = "0.9"
rand_distr = "0.5"
serde = { version = "1.0.166", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
insta = "1.48.0"
proptest = { version = "1.8", default-features = false, features = ["no_std", "alloc"] }
serde_json = { version = "1.0.100", features = ["float_roundtrip"] }

[package.metadata.docs.rs]
all-features = true
