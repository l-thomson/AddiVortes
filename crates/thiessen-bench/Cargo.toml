[package]
name = "thiessen-bench"
version = "0.0.0"
edition.workspace = true
# Above the workspace's 1.74: criterion 0.8 requires 1.86 and gungraun 0.19
# requires 1.85.1. The published core crate keeps 1.74 and the MSRV leg of
# the test matrix builds `-p thiessen` alone.
rust-version = "1.86"
license.workspace = true
repository.workspace = true
description = "Benchmark registry and harness for the thiessen crate"
publish = false

[features]
# Forwarded, so the registry carries the experimental models under the flag
# the rest of the workspace uses.
experimental = ["thiessen/experimental"]

[dependencies]
thiessen = { path = "../thiessen" }

[dev-dependencies]
# No plots and no rayon: deltas are read through critcmp, and a thread pool
# inside the harness would confound a single-threaded measure.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
gungraun = "0.19"

# `test = false` on both: `cargo test` runs bench targets by default, which
# would put a criterion pass into every test run and would invoke the
# callgrind harness on machines without valgrind.
[[bench]]
name = "wall_clock"
harness = false
test = false

[[bench]]
name = "instructions"
harness = false
test = false
