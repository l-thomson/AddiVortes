      "NeedsCompilation": "yes",
      "Author": "Adam Stone [aut] (ORCID: <https://orcid.org/0009-0004-0058-6117>), John Paul Gosling [aut, cre] (ORCID: <https://orcid.org/0000-0002-4072-3022>), Andrew Iskauskas [aut] (ORCID: <https://orcid.org/0000-0003-2825-3651>)",
