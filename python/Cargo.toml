[package]
name = "thiessen-python"
version = "0.1.0"
edition.workspace = true
# Above the workspace's 1.74: pyo3 0.29, the first release without the
# RUSTSEC-2026-0176 and RUSTSEC-2026-0177 advisories, requires 1.83. The
# published core crate keeps 1.74.
rust-version = "1.83"
license.workspace = true
repository.workspace = true
description = "Python bindings to the thiessen crate"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.29"
# `pyo3/extension-module` is set by maturin, not here: with it enabled the
# extension does not link libpython, and the workspace `cargo test` and
# `cargo clippy --all-targets` would fail to build this target.
pyo3 = { version = "0.29", features = ["abi3-py39"] }
# `float_roundtrip` so a saved model reloads bit-exact; the default parser
# is accurate to within one ULP, which moves the draws.
serde_json = { version = "1.0.100", features = ["float_roundtrip"] }
thiessen = { path = "../crates/thiessen" }
